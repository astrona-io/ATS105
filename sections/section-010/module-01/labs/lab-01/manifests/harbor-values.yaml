# Helm values for Harbor (chart harbor-helm) in this environment.
# One address everywhere: https://harbor.localtest.me:8443.
expose:
  type: clusterIP
  tls:
    enabled: true
    certSource: secret
    secret:
      secretName: harbor-tls
  clusterIP:
    name: harbor
    ports:
      httpPort: 8080
      httpsPort: 8443
externalURL: https://harbor.localtest.me:8443
# Lets Harbor serve the CA at /api/v2.0/systeminfo/getcert.
caSecretName: harbor-tls
# Lab-only administrator password. A real installation sets its own.
harborAdminPassword: Harbor12345
# The key Harbor uses to encrypt stored secrets. Back it up with the database.
existingSecretSecretKey: harbor-secretkey
persistence:
  enabled: false
trivy:
  enabled: false
metrics:
  enabled: false
# Harbor publishes its images for amd64 only. On an arm64 machine (Apple
# silicon) they run under emulation, and the bundled Valkey (Redis) crashes
# there. The official Valkey image is multi-architecture and replaces it.
redis:
  internal:
    image:
      repository: docker.io/valkey/valkey
      tag: 8.1.10-alpine
