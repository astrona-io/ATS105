# Upgrade Harbor In Place After A Backup
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-105-lab-040-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Helm 3.22.1, the external services, Harbor (chart 1.19.2) and the workstation pod"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-105-lab-040-02-setup"
      description: "Starts Harbor 2.15.2 (chart 1.19.2) on postgres with inventory/podinfo:6.15.0"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until Harbor answers before the reference solution runs"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-backup-before-upgrade"
      description: "Confirms a valid custom-format dump older than the upgraded core pods"
      type: "file"
      source: "validation/validate-backup-before-upgrade.sh"
    - name: "validate-chart-version"
      description: "Confirms Harbor runs chart 1.19.4"
      type: "file"
      source: "validation/validate-chart-version.sh"
    - name: "validate-database-unchanged"
      description: "Confirms Harbor still uses the database server postgres"
      type: "file"
      source: "validation/validate-database-unchanged.sh"
    - name: "validate-read-write"
      description: "Confirms Harbor is out of read-only mode"
      type: "file"
      source: "validation/validate-read-write.sh"
    - name: "validate-artifact"
      description: "Confirms inventory/podinfo:6.15.0 still pulls"
      type: "file"
      source: "validation/validate-artifact.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - amazon/aws-cli:2.38.4
      - docker.io/goharbor/harbor-core:v2.15.2
      - docker.io/goharbor/harbor-core:v2.15.4
      - docker.io/goharbor/harbor-db:v2.15.4
      - docker.io/goharbor/harbor-jobservice:v2.15.2
      - docker.io/goharbor/harbor-jobservice:v2.15.4
      - docker.io/goharbor/harbor-portal:v2.15.2
      - docker.io/goharbor/harbor-portal:v2.15.4
      - docker.io/goharbor/harbor-registryctl:v2.15.2
      - docker.io/goharbor/harbor-registryctl:v2.15.4
      - docker.io/goharbor/nginx-photon:v2.15.2
      - docker.io/goharbor/registry-photon:v2.15.2
      - docker.io/goharbor/registry-photon:v2.15.4
      - docker.io/goharbor/trivy-adapter-photon:v2.15.4
      - docker.io/goharbor/valkey-photon:v2.15.4
      - postgres:15.19-alpine
      - redis:7.4.11-alpine
      - versity/versitygw:v1.9.0
