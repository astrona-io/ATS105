# The workstation pod: the client tools every page uses, with Harbor's
# certificate authority (CA) trusted. Harbor itself is installed by Helm in
# bootstrap/prepare.sh, not by this file.
apiVersion: v1
kind: Namespace
metadata:
  name: workstation
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workstation-setup
  namespace: workstation
data:
  install-tools.sh: |
    #!/bin/sh
    # Downloads the pinned client tools into /tools (an emptyDir shared with
    # the main container). Runs once, as an init container.
    set -eu
    HARBOR_CLI_VERSION=0.0.27
    COSIGN_VERSION=3.1.4
    ORAS_VERSION=1.3.5
    REGCTL_VERSION=0.11.7
    ARCH="$(uname -m)"
    case "$ARCH" in x86_64) ARCH=amd64 ;; aarch64|arm64) ARCH=arm64 ;; esac
    cd /tmp
    wget -q "https://github.com/goharbor/harbor-cli/releases/download/v${HARBOR_CLI_VERSION}/harbor-cli_${HARBOR_CLI_VERSION}_linux_${ARCH}.tar.gz" -O harbor.tgz
    tar -xzf harbor.tgz
    find . -maxdepth 2 -type f -name 'harbor*' ! -name '*.tgz' -perm -u+x -exec cp {} /tools/harbor \;
    wget -q "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-${ARCH}" -O /tools/cosign
    wget -q "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_${ARCH}.tar.gz" -O oras.tgz
    tar -xzf oras.tgz oras && cp oras /tools/oras
    wget -q "https://github.com/regclient/regclient/releases/download/v${REGCTL_VERSION}/regctl-linux-${ARCH}" -O /tools/regctl
    chmod 0755 /tools/*
    ls -l /tools
  trust-harbor.sh: |
    #!/bin/sh
    # Fetches Harbor's CA and adds it to the system trust store, so every tool
    # in the pod can use https://harbor.localtest.me:8443 without --insecure.
    set -eu
    until curl -skf https://harbor.localtest.me:8443/api/v2.0/systeminfo/getcert -o /usr/local/share/ca-certificates/harbor-ca.crt; do
      echo "waiting for Harbor..."; sleep 5
    done
    update-ca-certificates >/dev/null 2>&1
    echo "Harbor CA trusted."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workstation
  namespace: workstation
  labels:
    app: workstation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workstation
  template:
    metadata:
      labels:
        app: workstation
    spec:
      initContainers:
        - name: install-tools
          image: alpine:3.22
          command: ["sh", "/setup/install-tools.sh"]
          volumeMounts:
            - name: tools
              mountPath: /tools
            - name: setup
              mountPath: /setup
      containers:
        - name: workstation
          image: alpine:3.22
          command: ["sh", "-c", "apk add --no-cache curl jq ca-certificates >/dev/null && sh /setup/trust-harbor.sh && while true; do sleep 30; done"]
          env:
            - name: PATH
              value: /tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: HARBOR_URL
              value: https://harbor.localtest.me:8443
          volumeMounts:
            - name: tools
              mountPath: /tools
            - name: setup
              mountPath: /setup
      volumes:
        - name: tools
          emptyDir: {}
        - name: setup
          configMap:
            name: workstation-setup
