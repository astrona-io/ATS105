# Run Harbor With High Availability (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-105-playground-020-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install Helm, the external services, Harbor (chart 1.19.4) and the workstation pod, then the module's starting state."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "The workstation pod with the client tools."
      type: "file"
      source: "manifests/lab-start.yaml"

teardown:
  keepCluster: false
