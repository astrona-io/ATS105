# Spread And Protect Harbor's Replicas
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-105-lab-020-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Helm 3.22.1, the external services, Harbor (chart 1.19.4) and the workstation pod"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-105-lab-020-02-setup"
      description: "Starts Harbor on the external services with two replicas per component, no disruption budgets and no spread rules"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until Harbor answers before the reference solution runs"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-replicas"
      description: "Confirms portal, core, jobservice and registry still run at least 2 ready replicas"
      type: "file"
      source: "validation/validate-replicas.sh"
    - name: "validate-pdbs"
      description: "Confirms each component has a PodDisruptionBudget with minAvailable 1 that allows a disruption"
      type: "file"
      source: "validation/validate-pdbs.sh"
    - name: "validate-spread"
      description: "Confirms core and registry have a hostname topology spread constraint with maxSkew 1"
      type: "file"
      source: "validation/validate-spread.sh"
    - name: "validate-harbor-healthy"
      description: "Confirms every Harbor component reports healthy"
      type: "file"
      source: "validation/validate-harbor-healthy.sh"
    - name: "validate-push-pull"
      description: "Confirms a push and a pull through Harbor work"
      type: "file"
      source: "validation/validate-push-pull.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - amazon/aws-cli:2.38.4
      - docker.io/goharbor/harbor-core:v2.15.4
      - docker.io/goharbor/harbor-db:v2.15.4
      - docker.io/goharbor/harbor-jobservice:v2.15.4
      - docker.io/goharbor/harbor-portal:v2.15.4
      - docker.io/goharbor/harbor-registryctl:v2.15.4
      - docker.io/goharbor/nginx-photon:v2.15.4
      - docker.io/goharbor/registry-photon:v2.15.4
      - docker.io/goharbor/trivy-adapter-photon:v2.15.4
      - docker.io/goharbor/valkey-photon:v2.15.4
      - postgres:15.19-alpine
      - redis:7.4.11-alpine
      - versity/versitygw:v1.9.0
